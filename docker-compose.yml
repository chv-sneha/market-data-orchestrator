# =============================================================================
# Stock Market Data Pipeline - Docker Compose
# =============================================================================
# Starts the complete stack with a single command:
#
#   docker compose up --build
#
# Services
# --------
#   postgres          — shared database (app data + Airflow metadata)
#   airflow-init      — one-shot container that initialises Airflow DB & admin
#   airflow-webserver — Airflow UI (http://localhost:8080)
#   airflow-scheduler — Airflow scheduler
# =============================================================================

version: "3.9"

# ---------------------------------------------------------------------------
# Named volumes — data persists across container restarts.
# ---------------------------------------------------------------------------
volumes:
  postgres_data:        # PostgreSQL data directory
  airflow_logs:         # Airflow task logs

# ---------------------------------------------------------------------------
# Shared Airflow environment — referenced by all Airflow services to keep
# configuration DRY.
# ---------------------------------------------------------------------------
x-airflow-common-env: &airflow-common-env
  # Airflow metadata DB connection (points to the shared postgres service)
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB}
  # Executor — LocalExecutor runs tasks in-process; ideal for single-node setups
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-False}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
  # Expose application env-vars to DAG tasks (stock pipeline config)
  ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
  STOCK_SYMBOLS: ${STOCK_SYMBOLS:-AAPL,MSFT,GOOGL}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-airflow-common-volumes: &airflow-common-volumes
  - ./dags:/opt/airflow/dags          # DAG definitions
  - ./scripts:/opt/airflow/scripts    # Pipeline business logic
  - airflow_logs:/opt/airflow/logs    # Task logs

# ---------------------------------------------------------------------------
services:
# ---------------------------------------------------------------------------

  # -----------------------------------------------------------------------
  # PostgreSQL
  # Hosts both the application data (stock_prices) and Airflow metadata.
  # Using a single Postgres instance keeps the Compose file simple; in
  # production you would use separate clusters.
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: stock_pipeline_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      # The postgres image bootstraps ONE default database.
      # We use the app DB credentials here; Airflow's DB is created below.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init.sql runs automatically the first time the container starts.
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Extra init script — creates the Airflow database and user.
      - ./sql/create_airflow_db.sql:/docker-entrypoint-initdb.d/create_airflow_db.sql:ro
    # ports:
    #  - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------------------------------------------------
  # Airflow initialisation (runs once, then exits)
  # Creates the Airflow metadata tables and the admin user.
  # -----------------------------------------------------------------------
  airflow-init:
    build: .
    container_name: stock_pipeline_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Initialising Airflow metadata database..."
        airflow db migrate
        echo "Creating Airflow admin user..."
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" \
          || echo "Admin user already exists — skipping."
        echo "Airflow initialisation complete."
    restart: "no"

  # -----------------------------------------------------------------------
  # Airflow Webserver — UI available at http://localhost:8080
  # -----------------------------------------------------------------------
  airflow-webserver:
    build: .
    container_name: stock_pipeline_airflow_webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Airflow Scheduler — triggers DAG tasks on schedule
  # -----------------------------------------------------------------------
  airflow-scheduler:
    build: .
    container_name: stock_pipeline_airflow_scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler
    restart: unless-stopped
